{% extends 'mailings/main.html'%}
{% block content %}

<div class="album py-5 bg-body-tertiary">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                 {% for object in object_list %}
                <div class="col">
                    <div class="card shadow-sm">


                        <div class="card-body"><p class="card-text">Рассылка №{{ object.pk }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                     <a href="{% url 'mailings:mailing_detail' object.pk  %}"  class="btn btn-primary my-2">Просмотр</a>
                                    <button type="button" class="btn btn-sm btn-outline-secondary">Edit</button>
                                </div>
                                <small class="text-body-secondary">9 mins</small></div>

                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

{% endblock %}
