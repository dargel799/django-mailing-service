{% extends 'mailings/main.html' %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 g-3">

            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Клиент №{{ object.pk }}</p>

                        <div class="border rounded p-3">
                            <ul class="list-unstyled mb-0">
                                <li><strong>Ф. И. О.:</strong> {{ object.full_name|default:"—" }}</li>
                                <li><strong>Email:</strong> {{ object.email }}</li>
                                <li><strong>Комментарий:</strong> {{ object.comment|default:"—" }}</li>
                            </ul>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="btn-group">
                                <a href="{% url 'mailings:client_update' object.pk %}" class="btn btn-primary my-2">Редактировать</a>

                                <form method="post" action="{% url 'mailings:client_delete' object.pk %}" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-outline-danger my-2">Удалить</button>
                                </form>
                            </div>

                            <a href="{% url 'mailings:client_list' %}" class="btn btn-sm btn-outline-secondary">Назад к списку</a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
