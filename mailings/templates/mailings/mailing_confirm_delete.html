{% extends 'mailings/main.html' %}
{% block content %}

<div class="col-12">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h4 class="mb-3">Удалить рассылку №{{ object.pk }}?</h4>
                <p class="text-body-secondary">Это действие необратимо.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger rounded-3 my-2">Удалить</button>
                    <a href="{% url 'mailings:mailing_detail' object.pk %}" class="btn btn-outline-secondary rounded-3 my-2 ms-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
</div>

{% endblock %}
