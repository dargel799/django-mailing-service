{% extends "mailings/main.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-4">
                    <h2 class="card-title mb-3">Ссылка недействительна</h2>
                    <p class="card-text text-body-secondary">
                        Срок действия ссылки для подтверждения почты истёк (она работает 24 часа).
                        Запросите новое письмо.
                    </p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'users:register' %}" class="btn btn-primary">Регистрация</a>
                        <a href="{% url 'users:login' %}" class="btn btn-outline-secondary">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
