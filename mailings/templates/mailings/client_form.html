{% extends 'mailings/main.html' %}
{% block content %}

<div class="col-12">
<div class="row justify-content-center">
    <div class="col-10 offset-1">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label">
                            Контактный email
                        </label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.full_name.id_for_label }}" class="form-label">
                            Ф. И. О.
                        </label>
                        {{ form.full_name }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.comment.id_for_label }}" class="form-label">
                            Комментарий
                        </label>
                        {{ form.comment }}
                    </div>

                    <button type="submit" class="btn btn-success">
                        {% if object %}
                        Сохранить
                        {% else %}
                        Создать
                        {% endif %}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</div>

{% endblock %}
